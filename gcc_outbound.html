  return 'mailto:'+email+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
}

function oa(urls){
  urls.forEach(function(u,i){

      var a=document.createElement('a');
      a.href=u;
      document.body.appendChild(a);
      a.click();

    },i*1800);
  });
}
